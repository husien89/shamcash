<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - شم كاش</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>⚙️ الإعدادات</h1>
        <div class="user-info">
            <span id="userDisplay"></span>
            <button onclick="logout()" class="btn btn-sm btn-logout">خروج</button>
        </div>
    </header>

    <main class="container">
        <div class="settings-section">
            <h3>🏛️ بيانات المؤسسة</h3>
            <div class="form-group">
                <label>اسم المؤسسة:</label>
                <input type="text" id="orgName" placeholder="اسم مؤسستكم">
            </div>
            <div class="form-group">
                <label>الرقم الضريبي:</label>
                <input type="text" id="taxNumber" placeholder="الرقم الضريبي">
            </div>
            <div class="form-group">
                <label>العنوان:</label>
                <textarea id="orgAddress" rows="2" placeholder="العنوان الكامل"></textarea>
            </div>
            <button onclick="saveOrgSettings()" class="btn">حفظ بيانات المؤسسة</button>
        </div>

        <div class="settings-section">
            <h3>🎨 إعدادات الطباعة</h3>
            <label><input type="checkbox" id="showLogo"> عرض الشعار في الإشعار</label><br>
            <label><input type="checkbox" id="showSignature"> عرض مكان للتوقيع والختم</label><br>
            <label><input type="checkbox" id="includeNotes"> تضمين ملاحظات إضافية</label>
        </div>

        <div class="settings-section">
            <h3>🔧 خيارات متقدمة</h3>
            <button onclick="exportAllData()" class="btn btn-secondary">📥 تصدير جميع البيانات</button>
            <button onclick="importData()" class="btn btn-secondary">📤 استيراد بيانات</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html">🏠 الرئيسية</a>
        <a href="notifications.html">📋 السجل</a>
        <a href="settings.html" class="active">⚙️ الإعدادات</a>
    </nav>

    <script src="auth.js"></script>
    <script src="data.js"></script>
    <script>
        checkAuth();
        updateUserDisplay();
        loadSettings();
    </script>
</body>
</html>
