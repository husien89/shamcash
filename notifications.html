<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الإشعارات - شم كاش</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>📋 سجل الإشعارات</h1>
        <div class="user-info">
            <span id="userDisplay"></span>
            <button onclick="logout()" class="btn btn-sm btn-logout">تسجيل الخروج</button>
        </div>
    </header>

    <main class="container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 ابحث باسم المستلم أو المرجع...">
            <button onclick="searchRecords()" class="btn">بحث</button>
        </div>

        <div class="filter-bar">
            <select id="filterDate" onchange="filterRecords()">
                <option value="all">جميع التواريخ</option>
                <option value="today">اليوم</option>
                <option value="week">آخر أسبوع</option>
                <option value="month">آخر شهر</option>
            </select>
            <button onclick="exportExcel()" class="btn btn-secondary">📊 تصدير إكسل</button>
            <button onclick="clearAllConfirm()" class="btn btn-danger">🗑️ مسح الكل</button>
        </div>

        <div id="recordsList" class="records-container">
            <div class="empty-state">
                <p>لا يوجد إشعارات مسجلة حتى الآن</p>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html">🏠 الرئيسية</a>
        <a href="notifications.html" class="active">📋 السجل</a>
    </nav>

    <script src="auth.js"></script>
    <script src="data.js"></script>
    <script>
        checkAuth();
        updateUserDisplay();
        loadRecords();
    </script>
</body>
</html>
